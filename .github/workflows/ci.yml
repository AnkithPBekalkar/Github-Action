name: CI Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4
      
    - name: Run a Simple Test Check
      run: |
        echo "Running automated validation..."
        node -v
        npm --version
        echo "Tests passed successfully!"